[project]
name = "token-iq-migrations"
version = "0.4.92"
description = "Database migrations for Token IQ, kept out of the main package to keep it small."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NITCO Inc." },
]

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.4.92"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:token-iq-migrations==",
]
