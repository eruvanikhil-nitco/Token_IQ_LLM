name: Validate model_prices_and_context_window.json

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-model-prices-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # The price list moved to data/pricing/model_prices.json when it was consolidated into
      # one copy. This step still named the old root path, which no longer exists, so the job
      # failed on every pull request.
      - name: Validate data/pricing/model_prices.json
        run: |
          jq empty data/pricing/model_prices.json

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Check model_prices_and_context_window.schema.json is in sync
        run: |
          uv run --frozen python ci_cd/generate_model_prices_schema.py --check
