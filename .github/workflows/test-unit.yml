name: "Unit Tests"

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  push:
    branches:
      - main
      - litellm_internal_staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One caller for every tests/gateway shard, replacing the nine thin workflow
# files that each wrapped a single call to _test-unit-base.yml. Adding a shard is
# now one matrix entry rather than a new file.
#
# `name` is the shard id and nothing else, so each check reports as
# "<shard> / Run tests" exactly as it did when the shard had its own file. Those
# strings are the branch ruleset's required contexts, so they are load-bearing:
# renaming an entry renames a required check and the ruleset stops matching it.
#
# Every entry states its timeouts even when they equal the base workflow's
# defaults. An absent matrix key renders as an empty string, which is not a
# number, so a partially-specified entry would fail the call rather than fall
# back to the default.
#
# tests/proxy_unit_tests keeps its own caller (test-unit-proxy-db.yml): it is
# already a matrix and carries a shard-coverage guard that reads that file by
# name. Folding it in here is a follow-up, together with generalising that guard
# into assert_ci_coverage.py.
jobs:
  unit:
    name: ${{ matrix.shard }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-utils
            artifact-name: core-utils
            test-path: "tests/gateway/core_utils"
            workers: 2
            reruns: 1
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: enterprise-routing
            artifact-name: enterprise-routing
            test-path: >-
              tests/gateway/enterprise
              tests/gateway/google_genai
              tests/gateway/router_utils
              tests/gateway/router_strategy
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: integrations
            artifact-name: integrations
            test-path: "tests/gateway/integrations"
            workers: 2
            reruns: 3
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: Vertex AI
            artifact-name: llm-vertex-ai
            test-path: "tests/gateway/llms/vertex_ai"
            workers: 1
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: All Other Providers
            artifact-name: llm-other-providers
            test-path: "tests/gateway/llms --ignore=tests/gateway/llms/vertex_ai"
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: misc
            artifact-name: misc
            test-path: >-
              tests/sdk_function_trace
              tests/gateway/batches
              tests/gateway/secret_managers
              tests/gateway/a2a_protocol
              tests/gateway/anthropic_interface
              tests/gateway/completion_extras
              tests/gateway/compression
              tests/gateway/containers
              tests/gateway/endpoints
              tests/gateway/experimental_mcp_client
              tests/gateway/models
              tests/gateway/repositories
              tests/gateway/images
              tests/gateway/interactions
              tests/gateway/ocr
              tests/gateway/passthrough
              tests/gateway/rag
              tests/gateway/realtime_api
              tests/gateway/rerank_api
              tests/gateway/rust_bridge
              tests/gateway/sandbox
              tests/gateway/test_router
              tests/gateway/vector_stores
              tests/gateway/videos
              tests/gateway/test_*.py
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          # Token IQ's own tests, which until phase 4 were in no shard at all: seven of their
          # nine directories were invoked by no job, which is why assert_ci_coverage.py has
          # never exited 0. A new entry rather than a rename, because the `name` of each entry
          # is a branch-ruleset required context and renaming one stops the ruleset matching it.
          #
          # reruns: 0 deliberately. A rerun turns an isolation leak into an intermittent pass,
          # which is the failure this phase is most likely to introduce and least likely to
          # notice. Raise it only with a reason recorded.
          - shard: token-iq
            artifact-name: token-iq
            test-path: "tests/token_iq"
            workers: 2
            reruns: 0
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: proxy-auth
            artifact-name: proxy-auth
            test-path: >-
              tests/gateway/proxy/auth
              tests/gateway/proxy/hooks
              tests/gateway/proxy/policy_engine
              tests/gateway/proxy/client
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: proxy-endpoints
            artifact-name: proxy-endpoints
            test-path: >-
              tests/gateway/proxy/analytics_endpoints
              tests/gateway/proxy/management_endpoints
              tests/gateway/proxy/list_api
              tests/gateway/proxy/memory
              tests/gateway/proxy/guardrails
              tests/gateway/proxy/management_helpers
              tests/gateway/proxy/anthropic_endpoints
              tests/gateway/proxy/google_endpoints
              tests/gateway/proxy/openai_files_endpoint
              tests/gateway/proxy/batches_endpoints
              tests/gateway/proxy/fine_tuning_endpoints
              tests/gateway/proxy/vector_store_files_endpoints
              tests/gateway/proxy/video_endpoints
              tests/gateway/proxy/response_api_endpoints
              tests/gateway/proxy/image_endpoints
              tests/gateway/proxy/ocr_endpoints
              tests/gateway/proxy/vector_store_endpoints
              tests/gateway/proxy/agent_endpoints
              tests/gateway/proxy/a2a
              tests/gateway/proxy/credential_endpoints
              tests/gateway/proxy/discovery_endpoints
              tests/gateway/proxy/health_endpoints
              tests/gateway/proxy/shutdown
              tests/gateway/proxy/public_endpoints
              tests/gateway/proxy/prompts
              tests/gateway/proxy/rag_endpoints
              tests/gateway/proxy/rerank_endpoints
              tests/gateway/proxy/realtime_endpoints
              tests/gateway/proxy/ui_crud_endpoints
              tests/gateway/proxy/config_resolvers
              tests/gateway/proxy/utils
            workers: 4
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: proxy-server
            artifact-name: proxy-server
            test-path: "tests/gateway/proxy/proxy_server"
            workers: 4
            reruns: 2
            timeout-minutes: 60
            job-timeout-minutes: 100

          - shard: proxy-infra
            artifact-name: proxy-infra
            test-path: >-
              tests/gateway/proxy/db
              tests/gateway/proxy/middleware
              tests/gateway/proxy/spend_tracking
              tests/gateway/proxy/pass_through_endpoints
              tests/gateway/proxy/_experimental
              tests/gateway/proxy/experimental
              tests/gateway/proxy/common_utils
              tests/gateway/proxy/types_utils
              tests/gateway/proxy/logging_endpoints
              tests/gateway/proxy/test_*.py
            workers: 4
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: caching-local
            artifact-name: caching-local
            test-path: >-
              tests/local_testing/test_cache_preset_key.py
              tests/local_testing/test_caching_handler.py
              tests/local_testing/test_prompt_caching.py
              tests/local_testing/test_responses_stream_cache_keys.py
              tests/local_testing/test_unit_test_caching.py
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: proxy-extras
            artifact-name: proxy-extras
            test-path: "tests/token-iq-migrations"
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: enterprise-package
            artifact-name: enterprise-package
            test-path: "tests/enterprise"
            workers: 4
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60

          - shard: responses-caching-types
            artifact-name: responses-caching-types
            test-path: >-
              tests/gateway/responses
              tests/gateway/caching
              tests/gateway/types
            workers: 2
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: ${{ matrix.test-path }}
      workers: ${{ matrix.workers }}
      reruns: ${{ matrix.reruns }}
      timeout-minutes: ${{ matrix.timeout-minutes }}
      job-timeout-minutes: ${{ matrix.job-timeout-minutes }}
      artifact-name: ${{ matrix.artifact-name }}
